services:
  postgres:
    image: postgres:17
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  seaweedfs:
    # Konkret verzio, ne latest - ugyanaz az elv, mint a postgres:17-nel.
    image: chrislusf/seaweedfs:4.46
    container_name: pm-file-storage
    restart: unless-stopped
    ports:
      # 8333: S3 API (ez kell a backendnek es a bongeszonek)
      # 23646: admin feluelet - a MinIO kozossegi verziojabol ez mar kikerult
      - "8333:8333"
      - "23646:23646"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    # Az -s3.allowedOrigins alapertelmezese csillag, ezert fejlesztoin is explicit.
    #
    # A -admin.password fejlesztoi ertek, NEM titok - elesben env varbol jon. Ures ertek
    # eseten a SeaweedFS hitelesites nelkul szolgalja ki az admin feluletet.
    #
    # FIGYELEM: a "command: >" egy YAML blokk-skalar, amiben a # NEM komment, hanem szoveg.
    # Egy ide tett megjegyzes hamis argumentumkent kerul a parancsba, es mivel a Go
    # flag-feldolgozo az elso nem-flag argumentumnal leall, az utana jovo flagek NEM
    # ervenyesulnek. Minden magyarazat ide, a blokk ELE tartozik.
    command: >
      mini -dir=/data -s3
      -s3.autoCreateBucket
      -s3.allowedOrigins=http://localhost:5173
      -admin.password=DevAdmin123!
    volumes:
      - seaweed_data:/data
  
  openobserve:
    # Konkret verzio, ne latest - ugyanaz az elv, mint a postgres:17-nel.
    image: openobserve/openobserve:v1.0.0
    container_name: pm-openobserve
    restart: unless-stopped
    ports:
      # 5080 egyszerre a webes felulet es az OTLP betoltes portja
      - "5080:5080"
    environment:
      # A Seq hitelesites nelkul fogadta a logokat; az OpenObserve-hoz lokalisan is kell
      # root felhasznalo. Ezek fejlesztoi ertekek, NEM titkok - elesben env varbol jonnek.
      #
      # MINDKETTO ERTEKE KOTOTT, es az OpenObserve indulaskor PANIKOL, ha nem felel meg
      # (leellenorizve, nem feltetelezes):
      #   - az e-mail cimnek rendes domaint kell tartalmaznia; a "dev@localhost" ELUTASITVA,
      #   - a jelszo 8-128 karakter, es kell bele kisbetu, NAGYBETU, szam ES specialis karakter.
      ZO_ROOT_USER_EMAIL: dev@example.com
      ZO_ROOT_USER_PASSWORD: DevPass123!
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: 30
      # Az OpenObserve alapbol telemetriat kuld a gyartonak (ZO_TELEMETRY alapertelmezese
      # true) - a naploban ez a "sending a track event" sor. Egy olyan projektben, amely
      # tetelesen felsorolja az adatfeldolgozoit az adatkezelesi tajekoztatoban, egy
      # nem nevesitett kimeno adatforgalom nem kivanatos, ezert kikapcsoljuk.
      ZO_TELEMETRY: false
    volumes:
      - openobserve_data:/data

volumes:
  postgres_data:
  seaweed_data:
  redis_data:
  openobserve_data: