services:
  postgres:
    image: postgres:17
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectmanager
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: