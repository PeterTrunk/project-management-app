name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ProjectManager.slnx

      - name: Build
        run: dotnet build backend/ProjectManager.slnx --no-restore --configuration Release

      # A gyors kör: nincs Docker, nincs hálózat. Ha ez elbukik, a hiba a kódban van,
      # nem a környezetben - ezért fut előbb.
      - name: Test (unit)
        run: dotnet test backend/tests/ProjectManager.Tests/ProjectManager.Tests.csproj --no-build --configuration Release --verbosity normal

      # Külön lépésben, hogy az image letöltése ne a tesztek idejébe számítson bele,
      # és egy elakadás itt azonnal láthatóan a letöltés legyen.
      - name: Pull PostgreSQL image
        run: docker pull postgres:17

      # A Testcontainers a runner Docker daemonját használja. Külön lépés, hogy a
      # naplóban azonnal látszódjon, melyik kör bukott el.
      - name: Test (integration)
        run: dotnet test backend/tests/ProjectManager.IntegrationTests/ProjectManager.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ugyanaz, mint a Dockerfile-ban: a lockfile kötelező érvényű
      - name: Install
        run: npm ci

      # A `vite build` nem típusellenőriz, csak fordít. A svelte-check ezért külön lépés:
      # egy típushiba így merge előtt derül ki, nem futásidőben.
      # A tsconfig `src/**/*.ts` include-ja miatt a tesztfájlokra is kiterjed.
      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
