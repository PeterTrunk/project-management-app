name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ProjectManager.slnx

      - name: Build
        run: dotnet build backend/ProjectManager.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ProjectManager.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ugyanaz, mint a Dockerfile-ban: a lockfile kötelező érvényű
      - name: Install
        run: npm ci

      # A build script ma csak `vite build` - típusellenőrzés nincs benne.
      # Ha később bekerül a svelte-check, ide jöhet külön lépésként.
      - name: Build
        run: npm run build
