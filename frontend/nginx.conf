server {
    # Az unprivileged nginx image nem-rootként fut, ezért nem köthet 1024 alatti portra
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne adjuk ki a pontos nginx verziót a Server fejlécben
    server_tokens off;

    # SPA routing - minden kérés index.html-re
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
