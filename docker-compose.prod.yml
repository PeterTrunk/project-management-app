services:
  postgres:
    image: postgres:17
    container_name: pm-postgres
    restart: unless-stopped
    # A 100 a PostgreSQL alapertelmezese, tehat ez a sor funkcionalisan semmit nem valtoztat.
    # Azert van kiirva, mert a kod EBBOL szarmaztatja a kapcsolatkeszlet meretet
    # (ServiceCollectionExtensions.PostgresMaxConnections): egy implicit alapertekre
    # hivatkozo feltevest nem lehet atnezni, egy kiirt erteket igen. Ha ez valtozik,
    # a kodban levo allandot is at kell irni.
    command: postgres -c max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pma-internal

  redis:
    image: redis:alpine
    container_name: pm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pma-internal

  seaweedfs:
    # Konkret verzio, ne latest - ez a MinIO-s tanulsag. A 4.46 a legujabb olyan stabil
    # kiadas, amely megfelel a 30 napos fuggoseg-szabalynak (2026-09-08).
    image: chrislusf/seaweedfs:4.46
    container_name: pm-file-storage
    restart: unless-stopped
    environment:
      # Ezekbol lesz az S3 hozzaferes. HA HIANYOZNAK, az S3 API HITELESITES NELKUL fut -
      # leellenorizve: kulcsokkal minden hitelesites nelkuli keres 403-at kap.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY kotelezo - nelkule az S3 API hitelesites nelkul fut}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY kotelezo - nelkule az S3 API hitelesites nelkul fut}
    # A mini mod egyetlen folyamatban inditja a mastert, a volume servert, a filert es az
    # S3 gateway-t. Az -s3.allowedOrigins megadasa KOTELEZO: az alapertelmezes csillag,
    # vagyis minden origin szamara engedne a bongeszobol erkezo feltoltest.
    # Az admin felulet jelszava. A ":?" alak miatt a deploy ELBUKIK, ha nincs beallitva -
    # szandekosan, mert URES ertek eseten a SeaweedFS HITELESITES NELKUL szolgalja ki
    # (a -admin.password flag dokumentacioja szerint "if empty, auth is disabled").
    # A felulet csak loopbacken hallgat, tehat SSH-tunnel nelkul elerhetetlen - de egy
    # jelszo nelkuli admin panel a felhasznaloi fajlok felett rossz csere, meg SSH mogott is.
    command: >
      mini -dir=/data -s3
      -s3.autoCreateBucket
      -s3.allowedOrigins=${FRONTEND_URL}
      -admin.password=${S3_ADMIN_PASSWORD:?S3_ADMIN_PASSWORD kotelezo - ures ertek eseten az admin felulet hitelesites nelkul fut}
    ports:
      # Csak loopback, ahogy a MinIO konzol is volt: az admin felulet SSH-tunnelen
      # erheto el. Az S3 API (8333) NEM itt, hanem Traefiken keresztul publikus.
      - "127.0.0.1:23646:23646"
    volumes:
      - seaweed_data:/data
    healthcheck:
      # Az S3 gateway sajat allapot-vegpontja a 8333-on (leellenorizve: 200).
      # Szandekosan NEM a master vagy a filer healthz-je: az S3 API-t akarjuk ellenorizni,
      # mert a pm-api erre var a depends_on-ban.
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pma-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=Host(`${S3_DOMAIN}`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls=true"
      - "traefik.http.routers.storage.tls.certresolver=letsencrypt"
      - "traefik.http.services.storage.loadbalancer.server.port=8333"

  openobserve:
    # Konkret verzio, ne latest - egy image-frissites ne hozzon nema viselkedesvaltozast.
    image: openobserve/openobserve:v1.0.0
    container_name: pm-openobserve
    restart: unless-stopped
    # NINCS healthcheck, es ez tudatos - nem feledes.
    #
    # Az OpenObserve sajat allapot-vegpontja a /healthz, de a kepe (debian-slim alapu)
    # NEM tartalmaz sem curl-t, sem wget-et, sem netcatet, a /dev/tcp pedig bash-sajatossag.
    # Egy curl-os healthcheck tehat tartosan "unhealthy"-t jelezne egy mukodo
    # szolgaltatasrol - az rosszabb, mint a jelzes hianya.
    #
    # Es nem is kritikus: a pm-api NEM var ra a depends_on-ban, a Serilog sinkjei
    # kotegelve, aszinkron kuldenek, tehat az aggregator kiesese az alkalmazast nem
    # lassitja es nem rontja el. A healthcheck itt kizarolag a telepito
    # feluleten latszo allapotjelzest adna.
    environment:
      # Szandekosan ugyanaz a nev kint es bent: ezek az OpenObserve SAJAT valtozoi, es a
      # dokumentacioja is ezen a neven hivatkozik rajuk. Egy elteo kulso nev (pl. OO_*) csak
      # annyit ad, hogy a telepito a belso nevet allitja be, a behelyettesites uresre oldodik,
      # es a kontener "password is too weak" hibaval meg sem indul.
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
      # A megorzesi ido NEM szabadon valaszthato. Ket oldalrol kotott:
      #   - az adatkezelesi tajekoztato 30 napot igér a technikai naplokra (jogi vallalas),
      #   - az OPERATIONS.md legalabb ennyit ker, hogy a mentesek 7 napja fole erjen.
      # Az OpenObserve alapertelmezese 3650 nap lenne, tehat ennek a kihagyasa csendben
      # megsertene a sajat tajekoztatonkat. Lasd OPERATIONS.md.
      ZO_COMPACT_DATA_RETENTION_DAYS: 30
      # Az OpenObserve alapbol telemetriat kuld a gyartonak (ZO_TELEMETRY alapertelmezese
      # true) - a naploban ez a "sending a track event" sor. Egy olyan projektben, amely
      # tetelesen felsorolja az adatfeldolgozoit az adatkezelesi tajekoztatoban, egy
      # nem nevesitett kimeno adatforgalom nem kivanatos, ezert kikapcsoljuk.
      ZO_TELEMETRY: false
    ports:
      # Csak loopback, ahogy a Seq is volt: a naplo erzekeny adatot tartalmazhat.
      # Tobb felhasznalos eleressel kapcsolatban lasd OPERATIONS.md.
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - pma-internal

  pm-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      # A peldanyszam egyetlen helyen deklaralva. Ugyanez a kifejezes szerepel a lenti
      # env blokkban is: a Compose mindkettot ugyanabbol a valtozobol helyettesiti be,
      # tehat a topologia es az app errol valo tudasa nem tud elcsuszni egymastol.
      # Ebbol harom dolog kovetkezik: hany konterner indul, kell-e Redis (1 peldanynal
      # nem, a korlatozas memoriaban szamol; tobbnel KOTELEZO, kulonben az API el sem
      # indul), es mekkora a DB kapcsolatkeszlet peldanyonkent.
      # FIGYELEM: a `docker compose up --scale pm-api=N` felulirja ezt az erteket az
      # env var valtozasa NELKUL - olyankor allitsd at a valtozot is, kulonben az app
      # egypeldanyosnak hiszi magat. Az indulasi naplo WRN sora ezt kimondja.
      replicas: ${API_REPLICAS:-2}
    #container_name: pm-api
    restart: unless-stopped
    # A /health vegpont szandekosan "shallow": csak azt mondja meg, hogy a folyamat
    # kiszolgal, adatbazist NEM kerdez. Ha melyebb lenne, egy adatbazis-kieses MINDKET
    # peldanyt kivenne a rotaciobol, es a felhasznalo a sajat hibauzenetunk helyett a
    # Traefik 503-at latna - vagyis a diagnosztika rosszabb lenne, nem jobb.
    #
    # start_period: a migracio es a harom indulasi feladat (webhook secret migracio,
    # TOTP titkositas, dokumentumverzio seed) az app.Run() ELOTT fut, tehat a port
    # addig nem is figyel. Enelkul a kontener elobb lenne "unhealthy", mint kesz.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5178/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        # service_healthy, nem service_started: a ConnectionMultiplexer.Connect() szinkron
        # es eager, tehat ha a Redis meg nem fogad kapcsolatot, az API RedisConnectionException-nel
        # el sem indul (merve). A redisnek van healthcheckje, igy ez ingyen van.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5178
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: ${S3_USE_SSL}
      S3_BUCKET: ${S3_BUCKET}
      API_BASE_URL: ${API_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_CONNECTION: ${REDIS_CONNECTION}
      # Ugyanaz a kifejezes, mint a fenti deploy.replicas - lasd az ottani megjegyzest.
      API_REPLICAS: ${API_REPLICAS:-2}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      JWT_REFRESH_TOKEN_LIFETIME: ${JWT_REFRESH_TOKEN_LIFETIME}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      ORPHAN_CLEANUP_INTERVAL_HOURS: ${ORPHAN_CLEANUP_INTERVAL_HOURS}
      TOKEN_CLEANUP_INTERVAL_HOURS: ${TOKEN_CLEANUP_INTERVAL_HOURS}
      REFRESH_TOKEN_RETENTION_DAYS: ${REFRESH_TOKEN_RETENTION_DAYS}
      CONFIRMED_UPLOAD_LOG_RETENTION_DAYS: ${CONFIRMED_UPLOAD_LOG_RETENTION_DAYS}
      OTLP_LOGS_ENDPOINT: ${OTLP_LOGS_ENDPOINT}
      OO_INGEST_USER: ${OO_INGEST_USER}
      OO_INGEST_TOKEN: ${OO_INGEST_TOKEN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    networks:
      - dokploy-network
      - pma-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=5178"
      # Keszenlet-jelzes a terheleselosztonak. Enelkul a Traefik akkor veszi fel a
      # kontenert szerverkent, amikor az FUT - nem amikor a port valaszol. Mivel az
      # indulasi munka (migracio + harom seed/backfill) az app.Run() elott fut, egy
      # gordulo ujrainditas alatt a kor-korbejaras olyan peldanyhoz is kuldene kerest,
      # ahol meg senki nem hallgat: azok 502/503-cal elesnek. Retry middleware nincs
      # beallitva, tehat nincs, ami ezt elfedje.
      #
      # Ezt a Traefik kivulrol vegzi, tehat NEM igenyel eszkozt a kontenerben -
      # a Dockerfile-ban telepitett curl a Docker-szintu healthcheckhez kell.
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.middlewares.api-ws.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.api-security.headers.stsSeconds=300"
      - "traefik.http.middlewares.api-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.api-security.headers.frameDeny=true"
      - "traefik.http.middlewares.api-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.api.middlewares=api-ws,api-security"
      - "traefik.http.routers.api-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      # SignalR affinity. FIGYELEM: a kliens mostantol skipNegotiation + WebSockets modban
      # kapcsolodik, tehat egyetlen keres epul fel - ennek a cookie-nak a SignalR szempontjabol
      # NINCS dolga. Szandekosan marad: ha valaki a kliensen visszaveszi a negotiate-et vagy a
      # transport-visszaesest, enelkul a kapcsolat ketreplikas kornyezetben idonkent nem epulne
      # fel (a negotiate connectionToken-je a kiado peldany memoriajaban el).
      #
      # A maxage=30 NEM csuszo ablak: a Traefik valid cookie eseten korai visszateressel
      # kiszolgal, Set-Cookie nelkul (ellenorizve a v3.1 forrasaban:
      # pkg/server/service/loadbalancer/wrr/wrr.go). Long polling eseten ezert 30 masodperc
      # utan elszakadna a kapcsolat - ezt a transport megkotese zarja ki a kliensen.
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.name=signalr_affinity"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.httponly=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.samesite=strict"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.maxage=30"
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_BASE_URL}
        VITE_SIGNALR_KEEPALIVE_ENABLED: ${VITE_SIGNALR_KEEPALIVE_ENABLED}
        VITE_SIGNALR_KEEPALIVE_SECONDS: ${VITE_SIGNALR_KEEPALIVE_SECONDS}
        VITE_JWT_ACCESS_TOKEN_LIFETIME: ${JWT_EXPIRY_MINUTES}
        VITE_LEGAL_CONTROLLER_NAME: ${VITE_LEGAL_CONTROLLER_NAME}
        VITE_LEGAL_CONTROLLER_ADDRESS: ${VITE_LEGAL_CONTROLLER_ADDRESS}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL}
        VITE_LEGAL_HOSTING_PROVIDER: ${VITE_LEGAL_HOSTING_PROVIDER}
    container_name: pm-frontend
    restart: unless-stopped
    depends_on:
      - pm-api
    networks:
      - dokploy-network
      - pma-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend-http.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=frontend-https-redirect"
      - "traefik.http.middlewares.frontend-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.frontend-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.frontend-security.headers.frameDeny=true"
      - "traefik.http.middlewares.frontend-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.frontend-security.headers.stsSeconds=300"
      - "traefik.http.middlewares.frontend-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.frontend-security.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.routers.frontend.middlewares=frontend-security"
      - "traefik.http.middlewares.frontend-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.trunkpeter.com wss://api.trunkpeter.com https://files.trunkpeter.com; font-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"

networks:
  dokploy-network:
    external: true
  pma-internal:
    driver: bridge
    name: pma-internal

volumes:
  postgres_data:
  seaweed_data:
  redis_data:
  openobserve_data: